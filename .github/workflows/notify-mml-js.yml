# Hand-maintained cross-repo trigger.
name: notify-mml-js

# After every successful mml release, dispatch to plurimath/mml-js so
# it can compile the released version and publish to npm as
# @plurimath/mml.
#
# This listens for the release workflow finishing rather than for the
# version-bump push: the release workflow pushes that bump with the
# repository GITHUB_TOKEN, and GitHub starts no push-triggered runs for
# pushes made with that token.
#
# The version is bound to the release run, not read from main: the
# release bumps the version in a commit directly on top of the run's
# head_sha and tags that commit, so only a version whose tag points at
# that commit is dispatched. A run that made no bump (next_version=skip)
# dispatches nothing.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Find the version this release run tagged
        id: ver
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$HEAD_SHA" | grep -qxE '[0-9a-f]{40}'; then
            printf '::error::unexpected head_sha: %q\n' "$HEAD_SHA"
            exit 1
          fi
          # The bump commit is the commit on main's first-parent line
          # whose parent is head_sha.
          BUMP=$(git rev-list --first-parent --parents origin/main \
            | awk -v h="$HEAD_SHA" '!found && $2 == h { print $1; found = 1 }')
          NEW=""
          if [ -n "$BUMP" ]; then
            # A version file that cannot be read is an error, not a skip.
            if ! SOURCE=$(git show "$BUMP:lib/mml/version.rb"); then
              printf '::error::cannot read lib/mml/version.rb at %s\n' "$BUMP"
              exit 1
            fi
            NEW=$(printf '%s\n' "$SOURCE" \
              | { grep -oE 'VERSION = "[^"]+"' || true; } | sed -n 1p | cut -d'"' -f2)
          fi
          if [ -z "$NEW" ] || [ "$(git rev-parse -q --verify "refs/tags/v$NEW^{commit}" || true)" != "$BUMP" ]; then
            echo "no release commit for this run; not dispatching"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # VERSION goes into the dispatch payload and on to mml-js, which
          # publishes it to npm, so only an npm (semver) version string may
          # leave this job. A RubyGems prerelease such as 2.5.0.rc1 is not one.
          # grep matches line by line, so a value with a newline is
          # refused before it reaches grep.
          if [[ "$NEW" == *$'\n'* ]] || ! printf '%s' "$NEW" \
            | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'; then
            printf '::error::VERSION %q is not a semver version mml-js can publish\n' "$NEW"
            exit 1
          fi
          echo "release commit $BUMP is tagged v$NEW; dispatching"
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Dispatch do-release to plurimath/mml-js
        if: steps.ver.outputs.dispatch == 'true'
        # v3.0.0
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0
        with:
          token: ${{ secrets.PLURIMATH_CI_PAT_TOKEN }}
          repository: plurimath/mml-js
          event-type: do-release
          client-payload: |
            {
              "version": "${{ steps.ver.outputs.version }}",
              "ruby_ref": "v${{ steps.ver.outputs.version }}"
            }
