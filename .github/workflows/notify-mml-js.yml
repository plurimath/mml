# Hand-maintained cross-repo trigger.
name: notify-mml-js

# After each successful release, dispatch do-release to plurimath/mml-js,
# which compiles that version with Opal and publishes it to npm as
# @plurimath/mml.
#
# Runs on workflow_run, not on push: the release pushes its version bump
# with GITHUB_TOKEN, which starts no push-triggered workflows.
#
# Dispatches only a commit tagged v<VERSION> for its own
# lib/mml/version.rb, and only if that commit is:
# - the child of head_sha on main's first-parent line (normal run), or
# - head_sha itself, on main, with no later v* tag on main (recovery run:
#   a release with next_version=skip after a run that tagged and failed).
# Fails if lib/mml/version.rb cannot be read or does not have exactly one
# `VERSION = "..."` line.
#
# Limits: the release commits and tags its bump on top of the main tip it
# checks out, which is head_sha only if main has not moved. If it moved,
# this run's release is not dispatched. If head_sha's child is a release
# commit tagged by another run, or by the first attempt of a re-run (which
# keeps head_sha), that version is dispatched instead. A run that made no
# bump also dispatches such a child. A version can be dispatched more than
# once; mml-js must treat an already-published version as done. To send a
# missed release, run release with next_version=skip while main is at that
# release's commit.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Find the version this release run tagged
        id: ver
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$HEAD_SHA" | grep -qxE '[0-9a-f]{40}'; then
            printf '::error::unexpected head_sha: %q\n' "$HEAD_SHA"
            exit 1
          fi
          # Sets V to VERSION in lib/mml/version.rb at commit $1.
          read_version() {
            local source
            if ! source=$(git show "$1:lib/mml/version.rb"); then
              printf '::error::cannot read lib/mml/version.rb at %s\n' "$1"
              exit 1
            fi
            local lines
            lines=$(printf '%s\n' "$source" \
              | { grep -E '^[[:space:]]*VERSION = "[^"]+"' || true; })
            V=$(printf '%s\n' "$lines" | sed -n '1s/^[^"]*"\([^"]*\)".*$/\1/p')
            if [ -z "$V" ] || [ "$(printf '%s\n' "$lines" | wc -l)" -ne 1 ]; then
              printf '::error::no VERSION = "..." line in lib/mml/version.rb at %s\n' "$1"
              exit 1
            fi
          }
          tag_commit() { git rev-parse -q --verify "refs/tags/v$1^{commit}" || true; }
          RELEASE=""
          NEW=""
          # Normal run: the bump commit is head_sha's child on main's
          # first-parent line.
          BUMP=$(git rev-list --first-parent --parents origin/main \
            | awk -v h="$HEAD_SHA" '!found && $2 == h { print $1; found = 1 }')
          if [ -n "$BUMP" ]; then
            read_version "$BUMP"
            if [ "$(tag_commit "$V")" = "$BUMP" ]; then
              RELEASE=$BUMP
              NEW=$V
            fi
          fi
          # Recovery run: head_sha is on main, is the tagged release commit,
          # and no later v* tag is on main.
          if [ -z "$RELEASE" ] && git merge-base --is-ancestor "$HEAD_SHA" origin/main 2>/dev/null \
            && [ -z "$(git tag -l 'v*' --merged origin/main --no-merged "$HEAD_SHA")" ]; then
            read_version "$HEAD_SHA"
            if [ "$(tag_commit "$V")" = "$HEAD_SHA" ]; then
              RELEASE=$HEAD_SHA
              NEW=$V
            fi
          fi
          if [ -z "$RELEASE" ]; then
            echo "no release commit for this run; not dispatching"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Accept only npm semver (2.5.0.rc1 is not).
          # Reject newlines before grep's per-line check.
          if [[ "$NEW" == *$'\n'* ]] || ! printf '%s' "$NEW" \
            | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'; then
            printf '::error::VERSION %q is not a semver version mml-js can publish\n' "$NEW"
            exit 1
          fi
          echo "release commit $RELEASE is tagged v$NEW; dispatching"
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Dispatch do-release to plurimath/mml-js
        if: steps.ver.outputs.dispatch == 'true'
        # v4.0.1
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ secrets.PLURIMATH_CI_PAT_TOKEN }}
          repository: plurimath/mml-js
          event-type: do-release
          client-payload: |
            {
              "version": "${{ steps.ver.outputs.version }}",
              "ruby_ref": "v${{ steps.ver.outputs.version }}"
            }
