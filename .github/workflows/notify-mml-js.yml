# Hand-maintained cross-repo trigger.
name: notify-mml-js

# After every successful mml release, dispatch to plurimath/mml-js so
# it can compile the released version and publish to npm as
# @plurimath/mml.
#
# This listens for the release workflow finishing rather than for the
# version-bump push: the release workflow pushes that bump with the
# repository GITHUB_TOKEN, and GitHub starts no push-triggered runs for
# pushes made with that token.
#
# The version is bound to the release run's head_sha, not read from
# the main tip. Only a commit that carries the tag v<VERSION> for its own
# lib/mml/version.rb is dispatched, and that commit must be one of two:
#
# - head_sha's child: the commit on main's first-parent line whose
#   parent is head_sha. The release bumps the version in a commit on
#   top of the main tip it checks out, and tags it; normally that is
#   head_sha, so the bump is this child. This is the normal case.
# - head_sha itself: a recovery run. When a release run bumps and tags
#   but then fails, a new release run started with next_version=skip on
#   main, whose tip is the tagged bump commit, has that commit as its
#   head_sha. This applies only while no later v* tag exists on
#   main after head_sha; otherwise head_sha's release is not the latest
#   and a run on it is not treated as its recovery.
#
# Anything else dispatches nothing. A version file that cannot be read,
# or that does not have exactly one `VERSION = "..."` line, fails the
# job.
#
# Known limits. The release checks out the main tip, not head_sha, so
# the child of head_sha is the commit this run tagged only if main
# did not move in between. If it moved, the new release is not
# dispatched; if the commit that moved it was itself a tagged release
# (another run, or a re-run of this one, which keeps the first
# attempt's head_sha), that earlier version is dispatched again
# instead. A run that made no bump, whose head_sha's child is a release
# commit tagged since, dispatches that version too. The same version
# can therefore be dispatched more than once, and plurimath/mml-js has to treat
# an already-published version as done. A missed release is sent by
# starting a release run with next_version=skip while the main tip is still that
# release's commit.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Find the version this release run tagged
        id: ver
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$HEAD_SHA" | grep -qxE '[0-9a-f]{40}'; then
            printf '::error::unexpected head_sha: %q\n' "$HEAD_SHA"
            exit 1
          fi
          # Sets V to the VERSION string in lib/mml/version.rb at commit
          # $1; fails the job if the file or the line is missing.
          read_version() {
            local source
            if ! source=$(git show "$1:lib/mml/version.rb"); then
              printf '::error::cannot read lib/mml/version.rb at %s\n' "$1"
              exit 1
            fi
            # Only an assignment at the start of a line counts, and it has
            # to be the only one.
            local lines
            lines=$(printf '%s\n' "$source" \
              | { grep -E '^[[:space:]]*VERSION = "[^"]+"' || true; })
            V=$(printf '%s\n' "$lines" | sed -n '1s/^[^"]*"\([^"]*\)".*$/\1/p')
            if [ -z "$V" ] || [ "$(printf '%s\n' "$lines" | wc -l)" -ne 1 ]; then
              printf '::error::no VERSION = "..." line in lib/mml/version.rb at %s\n' "$1"
              exit 1
            fi
          }
          tag_commit() { git rev-parse -q --verify "refs/tags/v$1^{commit}" || true; }
          RELEASE=""
          NEW=""
          # Normal run: the bump commit is the commit on main's
          # first-parent line whose parent is head_sha.
          BUMP=$(git rev-list --first-parent --parents origin/main \
            | awk -v h="$HEAD_SHA" '!found && $2 == h { print $1; found = 1 }')
          if [ -n "$BUMP" ]; then
            read_version "$BUMP"
            if [ "$(tag_commit "$V")" = "$BUMP" ]; then
              RELEASE=$BUMP
              NEW=$V
            fi
          fi
          # Recovery run: head_sha is on main and is itself the tagged
          # release commit.
          # A v* tag on a commit after head_sha means a later release
          # exists, so this run is not a recovery of head_sha's release.
          if [ -z "$RELEASE" ] && git merge-base --is-ancestor "$HEAD_SHA" origin/main 2>/dev/null \
            && [ -z "$(git tag -l 'v*' --merged origin/main --no-merged "$HEAD_SHA")" ]; then
            read_version "$HEAD_SHA"
            if [ "$(tag_commit "$V")" = "$HEAD_SHA" ]; then
              RELEASE=$HEAD_SHA
              NEW=$V
            fi
          fi
          if [ -z "$RELEASE" ]; then
            echo "no release commit for this run; not dispatching"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # VERSION goes into the dispatch payload and on to mml-js, which
          # publishes it to npm, so only an npm (semver) version string may
          # leave this job. A RubyGems prerelease such as 2.5.0.rc1 is not one.
          # grep matches line by line, so a value with a newline is
          # refused before it reaches grep.
          if [[ "$NEW" == *$'\n'* ]] || ! printf '%s' "$NEW" \
            | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'; then
            printf '::error::VERSION %q is not a semver version mml-js can publish\n' "$NEW"
            exit 1
          fi
          echo "release commit $RELEASE is tagged v$NEW; dispatching"
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Dispatch do-release to plurimath/mml-js
        if: steps.ver.outputs.dispatch == 'true'
        # v4.0.1
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ secrets.PLURIMATH_CI_PAT_TOKEN }}
          repository: plurimath/mml-js
          event-type: do-release
          client-payload: |
            {
              "version": "${{ steps.ver.outputs.version }}",
              "ruby_ref": "v${{ steps.ver.outputs.version }}"
            }
