name: opal

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  opal-verification:
    name: Opal boot file verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run Opal boot verification
        run: |
          bundle exec rspec spec/mml/opal_boot_spec.rb \
            --tag opal