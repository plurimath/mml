inherit_from:
  - https://raw.githubusercontent.com/riboseinc/oss-guides/master/ci/rubocop.yml
  - .rubocop_todo.yml

plugins:
- rubocop-performance
- rubocop-rake
- rubocop-rspec

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'spec/fixtures/mml2-testsuite/**/*'
    - 'spec/fixtures/mml3-testsuite/**/*'
    - 'spec/fixtures/mmlcore-testsuite/**/*'
    - 'spec/tasks/**/*'

# .gitattributes checks Ruby files out with LF on every OS, so check for LF
# rather than the platform-native line ending.
Layout/EndOfLine:
  EnforcedStyle: lf
